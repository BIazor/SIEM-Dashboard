[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/sim/*", "app/maintenance.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
